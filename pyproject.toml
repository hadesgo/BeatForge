[project]
name = "beatforge"
version = "0.2.0"
description = "Local-AI music video editor for consumer NVIDIA GPUs"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fonttools>=4.55",
  "librosa>=0.11.0",
  "numpy>=2.0",
  "pillow>=11.0",
  "pydantic>=2.10",
  "rich>=13.9",
  "soundfile>=0.13",
  "tqdm>=4.67",
  "typer>=0.15",
]

[project.optional-dependencies]
ai = [
  "huggingface-hub>=0.29",
  "modelscope>=1.22",
  "sentencepiece>=0.2",
  "transformers>=5.16.1",
]
ai-cpu = ["torch==2.14.0", "torchvision==0.29.0", "torchaudio==2.11.0", "torchcodec==0.16.0"]
ai-cuda = ["torch==2.14.0", "torchvision==0.29.0", "torchaudio==2.11.0", "torchcodec==0.16.0"]
qwen = [
  "qwen-vl-utils>=0.0.14",
  "sentence-transformers[image]>=5.7",
]
music-ai = ["all-in-one-infer>=3.0", "beat-this"]
# MelBand-RoFormer vocal separation ahead of ASR. onnxruntime is not optional: the
# package imports it at module scope even for the torch-based RoFormer models, so the
# CPU build is enough and a GPU build would buy nothing here.
# audioread is an undeclared dependency of audio-separator: it is imported at the top
# of uvr_lib_v5/spec_utils, which Separator pulls in on the way to loading any model.
separation = ["audio-separator>=0.47", "onnxruntime>=1.17", "audioread>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.8",
]

[project.scripts]
beatforge = "beatforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev"]
conflicts = [
  [{ extra = "ai-cpu" }, { extra = "ai-cuda" }],
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "ai-cpu" },
  { index = "pytorch-cu130", extra = "ai-cuda" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "ai-cpu" },
  { index = "pytorch-cu130", extra = "ai-cuda" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "ai-cpu" },
  { index = "pytorch-cu130", extra = "ai-cuda" },
]
torchcodec = [
  { index = "pytorch-cpu", extra = "ai-cpu" },
  { index = "pytorch-cu130", extra = "ai-cuda" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "C4", "SIM", "RUF", "PIE"]
# RUF001/002/003：全角标点（代码里的中文文案，300+ 处），按架构师 §4.4 一律不改
# B905：给 zip 补 strict 会在长度不一致时改变行为，纯重构不改
ignore = ["RUF001", "RUF002", "RUF003", "B905"]

[tool.ruff.lint.per-file-ignores]
# typer 的 Argument/Option 必须在默认值里调用，这是它的官方惯用法
"beatforge/cli.py" = ["B008"]
# 探针脚本需要在 import 之前操作 sys.path
"scripts/*" = ["E402", "PLC0415"]
