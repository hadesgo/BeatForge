music = "music.wav"
lyrics = "lyrics.lrc"
media_dir = "media"
output = "output.mp4"
cache_dir = ".beatforge"

[ai]
enabled = true
device = "auto"
offline = false
asr_backend = "qwen3"
qwen_asr_model = "Qwen/Qwen3-ASR-1.7B-hf"
qwen_aligner_model = "Qwen/Qwen3-ForcedAligner-0.6B-hf"
whisper_model = "small"
whisper_compute_type = "int8"
clap_model = "laion/clap-htsat-fused"
music_structure_backend = "allin1"
vision_backend = "qwen3-vl-embedding"
vision_model = "Qwen/Qwen3-VL-Embedding-8B"
vision_reranker_model = "Qwen/Qwen3-VL-Reranker-8B"
vision_quantization = "nf4"
vision_batch_size = 4
vision_rerank_top_k = 8
frame_samples = 5
director_enabled = true
director_model = "Qwen/Qwen3.5-9B"
director_quantization = "nf4"
director_temperature = 0.18
director_max_new_tokens = 3072
director_gpu_memory_gb = 9.0
director_cpu_memory_gb = 20.0
director_offload = true
director_contact_sheet_assets = 32

[render]
width = 960
height = 540
fps = 24
crf = 23
preset = "veryfast"
min_shot_seconds = 1.5
max_shot_seconds = 4.0
subtitle_font = "auto"
subtitle_size = 38
subtitle_effect = "auto"
subtitle_margin = 54
subtitle_highlight_color = "&H0000D7FF"
visual_effects = true
vignette = true
film_grain = 1.2

[render.subtitle_fonts]
energetic = "Arial Black"
uplifting = "Microsoft YaHei"
melancholic = "SimSun"
dreamy = "Microsoft YaHei Light"
romantic = "KaiTi"
dark = "SimHei"
cinematic = "Microsoft YaHei"
